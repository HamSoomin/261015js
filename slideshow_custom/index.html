<!DOCTYPE html>
<html lang="">

<head>
    <meta charset="UTF-8">
    <title>slideshow_custom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kaisei+Opti&family=Redaction+35:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="wrapper">
        <header>
            <h1>Korea_Seoul Tour</h1>
        </header>

        <div id="slide">
            <ul>
                <li><img src="img/1.jpeg" alt="img1"></li>
                <li><img src="img/2.jpeg" alt="img2"></li>
                <li><img src="img/3.jpg" alt="img3"></li>
                <li><img src="img/4.jpg" alt="img3"></li>
            </ul>
        </div><!-- /#slide -->

        <div id="button">
            <ul>
                <li><a href="#" class="target">1</a></li>
                <li><a href="#">2</a></li>
                <li><a href="#">3</a></li>
                <li><a href="#">4</a></li>
            </ul>
        </div><!-- /#button -->
    </div><!-- /#wrapper -->

    <!-- jQuery本体 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <!-- 自作JS -->
    <script src="script.js"></script>
</body>

</html>
